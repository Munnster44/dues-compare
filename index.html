<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dues Compare v1.0-PWA — © 2025 Glen Carruthers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Manifest + PWA -->
<link rel="manifest" href="manifest.json">
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

<!-- XLSX library (must exist in same directory) -->
<script src="xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 0;
}

header {
  background: #003366;
  color: #fff;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  width: 96%;
  max-width: 900px;
  margin: 20px auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px #0003;
}

button {
  background: #0055aa;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  margin: 6px 0;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
}
button:hover {
  background: #003f7d;
}

#spinner {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 999;
}
#spinner div {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 28px;
  font-weight: bold;
}

.countBox {
  background: #eef4ff;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
  font-size: 16px;
  line-height: 1.5;
}

footer {
  margin-top: 30px;
  text-align: center;
  font-size: 14px;
  padding: 15px;
  color: #666;
}
</style>

</head>
<body>

<header>Dues Compare v1.0-PWA</header>

<div id="spinner"><div>Processing…</div></div>

<div class="container">

<h3>Load Files</h3>

<label>Load Dues Paid File</label>
<input type="file" id="duesFile" accept=".xlsx,.xls">

<label>Load Membership File</label>
<input type="file" id="memberFile" accept=".xlsx,.xls">

<button onclick="compareFiles()">Run Compare</button>
<button onclick="saveOutput()">Save Output Excel</button>

<div class="countBox" id="counts">
<b>No data loaded.</b>
</div>

</div>

<footer>
Dues Compare v1.0-PWA — © 2025 Glen Carruthers
</footer>

<script>
let duesData = [];
let memberData = [];

/* Utility: show spinner */
function showSpin(flag){
  document.getElementById("spinner").style.display = flag ? "block":"none";
}

/* Load files and parse */
document.getElementById("duesFile").addEventListener("change", e => {
  readExcel(e.target.files[0], data => { duesData = data; updateCounts(); });
});
document.getElementById("memberFile").addEventListener("change", e => {
  readExcel(e.target.files[0], data => { memberData = data; updateCounts(); });
});

function readExcel(file, callback){
  showSpin(true);
  let reader = new FileReader();
  reader.onload = evt => {
    let workbook = XLSX.read(evt.target.result, { type: "binary" });
    let firstSheet = workbook.SheetNames[0];
    let rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { defval: "" });
    showSpin(false);
    callback(rows);
  };
  reader.readAsBinaryString(file);
}

/* Perform comparison */
let matchedDues = [];
let unmatchedDues = [];
let matchedMembers = [];
let unmatchedMembers = [];

function compareFiles(){
  if(!duesData.length || !memberData.length){
    alert("Please load BOTH files first.");
    return;
  }

  showSpin(true);

  matchedDues = [];
  unmatchedDues = [];
  matchedMembers = [];
  unmatchedMembers = [];

  /* Build fast lookup for membership IDs */
  let membershipIndex = {};
  memberData.forEach(m => {
    membershipIndex[(m["User ID"]+"").trim()] = m;
  });

  /* 1 — Dues Matched / Unmatched */
  duesData.forEach(d => {
    let id = (d["ID"]+"").trim();
    if(membershipIndex[id]){
      matchedDues.push(d);
    } else {
      unmatchedDues.push(d);
    }
  });

  /* 2 — Membership Matched / Did Not Pay */
  let duesIndex = {};
  duesData.forEach(d => {
    duesIndex[(d["ID"]+"").trim()] = true;
  });

  memberData.forEach(m => {
    let uid = (m["User ID"]+"").trim();
    if(duesIndex[uid]){
      matchedMembers.push(m);
    } else {
      unmatchedMembers.push(m);
    }
  });

  updateCounts();
  showSpin(false);
  alert("Comparison complete!");
}

/* Update on-screen stats */
function updateCounts(){
  let html = `
<b>Dues Loaded:</b> ${duesData.length}<br>
<b>Members Loaded:</b> ${memberData.length}<br><br>
<b>Matched (Dues):</b> ${matchedDues.length}<br>
<b>Unmatched (Dues):</b> ${unmatchedDues.length}<br>
<b>Matched (Membership):</b> ${matchedMembers.length}<br>
<b>Membership Unmatched:</b> ${unmatchedMembers.length}<br>
`;
  document.getElementById("counts").innerHTML = html;
}

/* Save XLSX */
function saveOutput(){
  if(!matchedDues.length && !unmatchedDues.length){
    alert("Run comparison first.");
    return;
  }

  showSpin(true);

  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matchedDues), "Matched");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(unmatchedDues), "Unmatched");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matchedMembers), "Matched-Members");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(unmatchedMembers), "Membership-Unmatched");

  let ts = new Date().toISOString().replace(/[-:T]/g,"").slice(0,14);
  let defaultName = "Dues_Compare-" + ts + ".xlsx";

  XLSX.writeFile(wb, defaultName);
  showSpin(false);
}
</script>

</body>
</html>
